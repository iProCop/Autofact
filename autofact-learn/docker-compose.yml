services:
  postgres:
    image: postgres:16-alpine
    container_name: autofact-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: autofact
      POSTGRES_PASSWORD: autofact
      POSTGRES_DB: autofact
    ports:
      - "5433:5432"
    volumes:
      - autofact_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autofact -d autofact"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: autofact-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - autofact_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    container_name: autofact-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  autofact_pg_data:
  autofact_redis_data:
